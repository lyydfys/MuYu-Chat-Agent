# MCA 官网静态站 —— 由 Caddy 反代（Caddy 负责 TLS / HTTP3 / gzip+zstd）
# 所以这里不再压一遍，避免双重编码。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 镜像里 server_tokens off，这里再显式关一次，少暴露版本
    server_tokens off;

    charset utf-8;

    # 静态图片：长缓存（文件名即版本）
    location ~* \.(webp|png|jpg|jpeg|svg|gif|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CSS/JS 无内容哈希，用较短缓存，避免改版后拿到旧样式
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # HTML 与元数据
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* ^/(robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 404.html 必须能直接访问（返回 200），同时作为错误页起作用。
    # 之前的 `internal` 让它只能由错误触发，直接请求会 404，这是错的。
    location = /404.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 未匹配路径走真正的 404 状态码。
    # 之前写 `try_files $uri $uri/ /404.html` 会把缺失页以 200 返回，搜索引擎会误认为
    # 那些不存在的 URL 是有效页面。
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 安全头（TLS 由 Caddy 终止）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 恢复 nginx 默认 MIME 表。注意：单独写一个 types{} 块会【替换】整张表，
    # 那样所有文件都会变成 application/octet-stream，浏览器就无法识别 HTML/CSS/JS。
    # 必须先 include mime.types，再补 webmanifest 这一条。
    include mime.types;
    types {
        application/manifest+json  webmanifest;
    }
    default_type application/octet-stream;

    autoindex off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
