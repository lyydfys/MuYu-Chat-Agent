<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 页面不存在 | MCA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --paper: #F8F9FA; --ink: #17191C; --muted: #62676D; --faint: #6B7178;
    --line: #E4E7EA; --blue: #1A73E8; --blue-ink: #185ABC;
    --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Segoe UI", "Helvetica Neue", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px;
    background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.7;
  }
  .box { width: 100%; max-width: 560px; }
  .code {
    display: flex; align-items: center; gap: 10px; padding-bottom: 18px; margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--muted);
  }
  .spark {
    width: 8px; height: 8px; background: var(--blue);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  }
  h1 { font-size: 56px; line-height: 1.1; letter-spacing: -.03em; margin: 0 0 18px; font-weight: 600; }
  .dot { color: var(--blue); }
  p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  ul { margin: 26px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 0; color: var(--ink); text-decoration: none; font-size: 14.5px;
  }
  a span { color: var(--blue-ink); font-family: var(--mono); font-size: 10px; letter-spacing: .1em; }
  a:hover { color: var(--blue-ink); }
  .foot { margin-top: 28px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--faint); }
</style>
</head>
<body>
  <div class="box">
    <div class="code"><span class="spark"></span>404 / NOT FOUND</div>
    <h1>页面不在这里<span class="dot">。</span></h1>
    <p>这个地址没有对应的内容。可能是链接过期，或者路径写错了。</p>
    <ul>
      <li><a href="/">回到首页 <span>HOME</span></a></li>
      <li><a href="https://github.com/lyydfys/MuYu-Chat-Agent/releases">下载最新版本 <span>RELEASES</span></a></li>
      <li><a href="https://github.com/lyydfys/MuYu-Chat-Agent/blob/master/README.md">查看文档 <span>DOCS</span></a></li>
      <li><a href="https://github.com/lyydfys/MuYu-Chat-Agent/issues">反馈问题 <span>ISSUES</span></a></li>
    </ul>
    <div class="foot">MCA / MUYU CHAT AGENT</div>
  </div>
</body>
</html>
