name: Android CI

# What this workflow does and does not cover.
#
# It runs the JVM-side gates that can run without the QAIRT/QNN SDK: compilation and the unit
# test suite. It deliberately does NOT produce a release artifact, and nothing it builds may be
# treated as production evidence. Two reasons, both structural rather than temporary:
#
#   1. Typed QAIRT/QNN bindings are required by default (core/native/build.gradle.kts and
#      CMakeLists.txt both fail closed without an SDK). The SDK is not uploaded to CI -- plan
#      sections 4.2 and 13.3 treat it as local material -- so this workflow opts into the
#      documented stub explicitly and says so.
#   2. The MNN runtime is produced by tools/build-mnn-runtime.ps1, a Windows PowerShell script
#      that an ubuntu runner cannot execute. Even with the QNN gate satisfied, the MNN library
#      in any CI-built APK would be a stub.
#
# Production native acceptance -- real QNN graphs, a real MNN runtime, a physical device and the
# authenticated Local API -- stays in the controlled environment described in plan section 13.4.
# Before this change every run of this workflow failed at :core:native:verifyMcaQnnSdkHeaders,
# so the workflow reported nothing at all. See E:\MAC_REFACTOR_EVIDENCE\P0-05-ci-workflow-broken.md.
#
# Lint is a step below. It was not, until the 8 errors this file used to describe were fixed:
# 3 NewApi reads of Build.SOC_MODEL (API 31) in debug-only smoke activities, now guarded the same
# way the production readers guard it, and 5 NonObservableLocale reads of Locale.getDefault() in
# McaApp, now LocalLocale.current.platformLocale. :app:lintDebug reports 0 errors and 128 warnings
# on this revision. The warning count did not change, which is the point -- nothing was suppressed
# to get here, and abortOnError is deliberately left at its default.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    name: Compile, lint and unit tests (QNN stub; not a production artifact)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # -PmcaQnnTypedBindingsRequired=false is the opt-in stub path the build script documents.
      # Every Gradle step below passes it, so no step can accidentally take the fail-closed path
      # and report a confusing SDK error instead of a real compile or test result.
      #
      # This job pins JDK 21, and that choice is load-bearing for the test step. Locally, on
      # JDK 17, :core:engine:testDebugUnitTest fails 7 tests with
      # UnsupportedClassVersionError: ... class file version 65.0 ... up to 61.0 -- the
      # litertlm-android artifact is built for Java 21. On JDK 21 those same tests are expected
      # to pass. That expectation comes from the error itself and is NOT verified here: no JDK 21
      # is available in the environment this workflow was written in. If a future CI run fails on
      # exactly those 7 tests, this comment is the place to start.
      - name: Run unit tests (stub QNN bindings)
        run: ./gradlew testDebugUnitTest --stacktrace -PmcaQnnTypedBindingsRequired=false

      - name: Compile debug sources (stub QNN bindings)
        run: ./gradlew :app:compileDebugKotlin --stacktrace -PmcaQnnTypedBindingsRequired=false

      # Runs over every module, not just :app -- :app:lintDebug pulls in the library modules'
      # lint analysis. Verified to finish with 0 errors and 128 warnings on this revision;
      # warnings do not fail the build, and no baseline or abortOnError setting was added.
      - name: Lint (stub QNN bindings)
        run: ./gradlew :app:lintDebug --stacktrace -PmcaQnnTypedBindingsRequired=false

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

      - name: Report what this run did not verify
        run: |
          echo "This job compiled sources, ran lint, and ran JVM unit tests with stubbed QAIRT/QNN bindings."
          echo "It did not build or validate the QNN runtime, the MNN runtime, or any release artifact."
          echo "Real native acceptance requires the controlled environment (plan section 13.4)."
