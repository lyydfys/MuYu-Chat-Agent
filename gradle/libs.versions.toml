androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
bouncycastle-bctls = { module = "org.bouncycastle:bctls-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
# GenieX is deliberately absent from this catalog. The project does not depend on
# com.qualcomm.qti:geniex-android from a repository: it builds against a locally patched AAR at
# vendor/geniex/geniex-android-0.3.12-mca1.aar, referenced as files(...) in core/engine and app,
# with its SHA-256 checked at build time. A catalog entry naming the upstream coordinate was
# removed because it described a dependency this project does not have, and would have led any
# version or vulnerability scan to report on the unpatched artifact instead of the one in use.
