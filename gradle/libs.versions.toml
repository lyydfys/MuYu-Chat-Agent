[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.7"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
ndk = "29.0.13113456"
composeBom = "2026.05.01"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
coroutines = "1.9.0"
okhttp = "4.12.0"
guava = "33.5.0-android"
datastore = "1.1.7"
work = "2.11.0"
room = "2.8.4"
kotlinxSerialization = "1.8.1"
junit = "4.13.2"
json = "20240303"
# N10/R2: real JavaScript engine for executable tool packages. Pure-JVM, no native ABI; the
# sandbox is host-side (ClassShutter + disabled globals + instruction observer), NOT an
# isolatedProcess/UID boundary. Source/version checked in artifacts cards N10.
rhino = "1.7.15"
# ADB wireless pairing: certificate TLS + RFC 5705 exporter. JSSE exposes neither, and the
# reference behaviour needs both; `bctls` is the only maintained JVM implementation. Same 1.79
# line as bcprov/bcutil already resolved on this machine (see docs/architecture/DSH_ADB_PAIRING.md).
bouncycastle = "1.86"
# Agent V1 strict model-output parser. Streaming Core parser only; no databind is introduced.
# Exact version/source is verified in docs/proposals/agent-v1/evidence/5e912ff9/dependency-verification.md.
jackson = "2.22.4"
# GeckoView: the second web kernel of the DSH workspace. Published only on Mozilla's Maven.
# The artifact is ABI-specific (91.5 MB AAR, `libxul.so` is 147 MB uncompressed), so the app ships
# the arm64-v8a one and the kernel falls back to the system WebView whenever it cannot load.
# Licensed MPL-2.0: file-level copyleft, no effect on MCA's Apache-2.0 sources.
# Pinned to the newest build whose AAR metadata still allows this project's compileSdk 36:
# 155.x and 157.x/159.x require compileSdk 37 (verified by reading their aar-metadata.properties),
# while 153.0 and older declare minCompileSdk=1. Raise this pin together with compileSdk, not alone.
geckoview = "153.0.20260810162159"
# G00/Q01 measurement stack. `benchmark` is pinned to the current stable macrobenchmark line.
# IMPORTANT: the androidx.benchmark artifacts are NOT in this machine's default Gradle cache, so
# `:benchmark` is opt-in (-Pmca.includeBenchmark=true) and only that build needs network access
# to resolve them. `uiAutomator`/`profileInstaller` are pinned to versions present in the local
# cache for the default build; benchmark-macro 1.5.0 pulls androidx.test.uiautomator 2.4.0
# transitively, which wins when :benchmark is enabled. See
# docs/proposals/audit/v9/MEASUREMENT-FACILITY.md (dependency status: 依赖未验证).
benchmark = "1.5.0"
testRunner = "1.7.0"
testExtJunit = "1.3.0"
uiAutomator = "2.3.0"
profileInstaller = "1.4.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
geckoview-arm64-v8a = { module = "org.mozilla.geckoview:geckoview-arm64-v8a", version.ref = "geckoview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
