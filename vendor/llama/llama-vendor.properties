# MCA-local, not an upstream PR. KleidiAI's packing/kernel paths cover Q4_0, Q4_K,
# Q8_0, Q6_K and F32. Without this patch the CPU_KLEIDIAI buffer callbacks keep a
# KleidiAI traits pointer on a tensor whose type has no kernel, so a GGUF can fail
# at graph compute time on arm64 instead of falling back to the regular CPU kernels.
# The capability gate tracks the kernel set of the pinned upstream revision.
kleidiaiPatchSource=mca-local
