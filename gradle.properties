android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Agent V1 adds three modules and a larger annotation/KSP graph to the same app compile. The
# previous 3 GiB Gradle / 2 GiB Kotlin daemon pair hit "GC overhead limit exceeded" while compiling
# :feature:chat on this 16 GiB machine; 4 GiB / 3 GiB with fewer parallel workers keeps the same
# build tasks and assertions, only with enough heap to finish them. No gate is skipped.
# DSH V1 adds three more modules (contract/runtime/gateway + workspace) to the same graph; the
# app-side Kotlin daemon OOM'd again at 4 GiB / 3 GiB during the parallel module compile, so the
# heaps are raised and workers reduced. This changes memory/throughput only, not tasks or gates.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.parallel=false
org.gradle.workers.max=1
# On this memory-constrained 16 GiB host a separate Kotlin daemon repeatedly failed with
# "Not enough memory to run compilation". Compiling in the Gradle daemon keeps a single bounded
# heap, uses exactly the same compiler/tasks/assertions, and does not skip any gate.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
